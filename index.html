<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Event Evaluation</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>

<body>

  <div class="container">

    <h1 class="title">Event Evaluation</h1>

     <div class="info-box">

  <div class="field">
    <label for="studentName">Name</label>
    <input type="text" id="studentName" placeholder="Enter your name" />
  </div>

  <div class="field">
    <label for="course">Course</label>
    <input type="text" id="course" placeholder="Enter your course" />
  </div>

  <div class="field">
    <label for="type">Type</label>
    <select id="type">
      <option value="">Select Type</option>
      <option value="Bachelor">Bachelor</option>
      <option value="Recognition">Recognition</option>
      <option value="Exercise">Exercise</option>
    </select>
  </div>

</div>

    <div id="questionsContainer"></div>

    <!-- SUGGESTION -->
    <textarea id="suggestion" placeholder="Add a suggestion..."></textarea>

    <button id="submitBtn">Submit</button>

  </div>

  <!-- LOADING -->
  <div id="loading" class="loading">
    <div class="loader"></div>
    <p>Please wait...</p>
  </div>

  <!-- SUCCESS MODAL -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h2>Success 🎉</h2>
      <p>Evaluation added successfully!</p>
      <button id="closeModal">back</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
